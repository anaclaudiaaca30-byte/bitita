services:
  - type: web
    name: bitita-web
    env: python
    plan: free
    buildCommand: pip install -r webapp/requirements.txt
    startCommand: uvicorn webapp.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bitita-db
          property: connectionString
